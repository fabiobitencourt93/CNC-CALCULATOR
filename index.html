<!DOCTYPE html><html lang="pt-br"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css"><title>CNC Calculator</title></head>
<body><div class="card"><h1>Calculadora CNC</h1>
<label>Material</label><select id="material"></select>
<label>Diâmetro (mm)</label><input id="d" type="number" value="16">
<label>Dentes</label><input id="z" type="number" value="4">
<label>fz (mm)</label><input id="fz" type="number" step="0.01" value="0.08">
<button id="calc">Calcular</button>
<h2>RPM: <span id="rpm">0</span></h2>
<h2>Avanço: <span id="feed">0</span> mm/min</h2></div>
<script src="js/materials.js"></script><script src="js/app.js"></script></body></html>
